<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Time per element lookup vs. elements in the tree, XPath and UiSelector, Android emulator">
<title>Time per lookup vs. elements in the tree</title>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --xpath: #eb6834; --ui: #2a78d6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { svg { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --grid: #2c2c2a; --axis: #383835; --xpath: #d95926; --ui: #3987e5; } }
  .bg { fill: var(--surface); }
  .t1 { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .t2 { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .tick { fill: var(--muted); font-size: 11px; }
  .val, .leg { fill: var(--ink2); font-size: 12px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .line.s-xpath { stroke: var(--xpath); } .dot.s-xpath { fill: var(--xpath); }
  .line.s-ui { stroke: var(--ui); } .dot.s-ui { fill: var(--ui); }
</style>
<rect class="bg" width="720" height="420" rx="8"/>
<text class="t1" x="64" y="28">Time per element lookup vs. elements in the tree</text>
<line class="line s-xpath" x1="448" x2="464" y1="24" y2="24"/><text class="leg" x="470" y="28">XPath</text>
<line class="line s-ui" x1="524" x2="540" y1="24" y2="24"/><text class="leg" x="546" y="28">UiSelector</text>
<text class="t2" x="64" y="62">Emulator AOSP_API_36, Android 16, UiAutomator2 server 10.6.6</text>
<line class="axis" x1="64" x2="624" y1="368" y2="368"/>
<text class="tick" x="56" y="372" text-anchor="end">0 ms</text>
<line class="grid" x1="64" x2="624" y1="313.6" y2="313.6"/>
<text class="tick" x="56" y="317.6" text-anchor="end">250 ms</text>
<line class="grid" x1="64" x2="624" y1="259.2" y2="259.2"/>
<text class="tick" x="56" y="263.2" text-anchor="end">500 ms</text>
<line class="grid" x1="64" x2="624" y1="204.8" y2="204.8"/>
<text class="tick" x="56" y="208.8" text-anchor="end">750 ms</text>
<line class="grid" x1="64" x2="624" y1="150.39999999999998" y2="150.39999999999998"/>
<text class="tick" x="56" y="154.39999999999998" text-anchor="end">1000 ms</text>
<line class="grid" x1="64" x2="624" y1="96" y2="96"/>
<text class="tick" x="56" y="100" text-anchor="end">1250 ms</text>
<text class="tick" x="92" y="386" text-anchor="middle">100</text>
<text class="tick" x="203.16" y="386" text-anchor="middle">497</text>
<text class="tick" x="344" y="386" text-anchor="middle">1000</text>
<text class="tick" x="620.9200000000001" y="386" text-anchor="middle">1989</text>
<text class="tick" x="344" y="406" text-anchor="middle">elements in the tree</text>
<polyline class="line s-xpath" points="92.0,358.5 203.2,312.2 344.0,246.9 620.9,117.7"/>
<circle class="dot s-xpath" cx="92.0" cy="358.5" r="4"><title>XPath, 100 elements: 44 ms</title></circle>
<circle class="dot s-xpath" cx="203.2" cy="312.2" r="4"><title>XPath, 497 elements: 256 ms</title></circle>
<circle class="dot s-xpath" cx="344.0" cy="246.9" r="4"><title>XPath, 1000 elements: 557 ms</title></circle>
<circle class="dot s-xpath" cx="620.9" cy="117.7" r="4"><title>XPath, 1989 elements: 1.15 s</title></circle>
<text class="val" x="630.9200000000001" y="115.70922666666667">1.15 s</text>
<polyline class="line s-ui" points="92.0,363.2 203.2,323.6 344.0,262.4 620.9,146.6"/>
<circle class="dot s-ui" cx="92.0" cy="363.2" r="4"><title>UiSelector, 100 elements: 22 ms</title></circle>
<circle class="dot s-ui" cx="203.2" cy="323.6" r="4"><title>UiSelector, 497 elements: 204 ms</title></circle>
<circle class="dot s-ui" cx="344.0" cy="262.4" r="4"><title>UiSelector, 1000 elements: 485 ms</title></circle>
<circle class="dot s-ui" cx="620.9" cy="146.6" r="4"><title>UiSelector, 1989 elements: 1.02 s</title></circle>
<text class="val" x="630.9200000000001" y="158.596352">1.02 s</text>
<text class="tick" x="64" y="80">UiSelector 12–49 % faster per lookup (30 cases, median of 3 passes)</text>
</svg>
